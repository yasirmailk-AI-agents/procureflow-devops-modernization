global:
  environment: prod
networkPolicy:
  enabled: true
services:
  frontend:
    replicas: 3
    autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 8, targetCPUUtilizationPercentage: 65}
    pdb: {enabled: true, minAvailable: 2}
  order:
    replicas: 3
    autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 10, targetCPUUtilizationPercentage: 65}
    pdb: {enabled: true, minAvailable: 2}
