apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: procureflow-dev
type: Opaque
stringData:
  root-password: root-dev-password
  database: legacy_procureflow
  username: procureflow
  password: procureflow-dev-password
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: procureflow-dev
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: procureflow-dev
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: mysql-credentials, key: root-password}}
            - name: MYSQL_DATABASE
              valueFrom: {secretKeyRef: {name: mysql-credentials, key: database}}
            - name: MYSQL_USER
              valueFrom: {secretKeyRef: {name: mysql-credentials, key: username}}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: mysql-credentials, key: password}}
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
