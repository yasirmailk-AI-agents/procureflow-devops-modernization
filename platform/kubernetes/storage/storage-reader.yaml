apiVersion: v1
kind: Pod
metadata:
  name: storage-reader
  namespace: procureflow-dev
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    - name: reader
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - |
          cat /data/result
          sleep 3600
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: storage-smoke
