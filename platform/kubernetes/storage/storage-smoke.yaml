apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-smoke
  namespace: procureflow-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: storage-smoke
  namespace: procureflow-dev
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    - name: writer
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - |
          echo STORAGE_OK > /data/result
          cat /data/result
          sleep 3600
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: storage-smoke
