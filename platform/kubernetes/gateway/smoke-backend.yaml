apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-smoke-nginx
  namespace: procureflow-dev
data:
  default.conf: |
    server {
      listen 8080;
      location = /smoke { default_type text/plain; return 200 "GATEWAY_SMOKE_OK\n"; }
      location = /health { default_type text/plain; return 200 "HEALTHY\n"; }
      location / { default_type text/plain; return 404 "PATH_NOT_FOUND\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-smoke
  namespace: procureflow-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-smoke
  template:
    metadata:
      labels:
        app: gateway-smoke
    spec:
      containers:
        - name: gateway-smoke
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: gateway-smoke-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-smoke
  namespace: procureflow-dev
spec:
  selector:
    app: gateway-smoke
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-smoke
  namespace: procureflow-dev
spec:
  parentRefs:
    - name: procureflow-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /smoke
      backendRefs:
        - name: gateway-smoke
          port: 80
