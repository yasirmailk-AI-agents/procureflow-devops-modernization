apiVersion: v1
kind: ResourceQuota
metadata:
  name: environment-budget
  namespace: procureflow-dev
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 4Gi
    limits.cpu: "6"
    limits.memory: 8Gi
    pods: "40"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: procureflow-dev
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: 512Mi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: "25m"
        memory: 32Mi
