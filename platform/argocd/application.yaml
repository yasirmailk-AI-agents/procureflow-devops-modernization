apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: procureflow-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_ME/procureflow-devops-modernization.git
    targetRevision: main
    path: platform/helm/procureflow
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: procureflow-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
